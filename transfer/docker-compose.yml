version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  zookeeper:
    # Указываем полный путь к образу через зеркало Docker Hub
    image: dockerhub.timeweb.cloud/confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: dockerhub.timeweb.cloud/confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  transport:
    build: .
    container_name: transport
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKER: kafka:9092
      AGENT_SUMMARY_URL: http://172.29.89.163:8001/api/summary   # замените на реальный адрес
      APP_RECEIVE_URL: http://172.29.71.190:8001/receive
      LOSS_PROBABILITY: 1
      ASSEMBLY_INTERVAL_SEC: 2
      LOSS_TIMEOUT_SEC: 4
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network