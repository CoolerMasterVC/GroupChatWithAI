version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_WS_URL=ws://websocket-server:8001
    depends_on:
      - websocket-server
    networks:
      - messenger-network
    restart: unless-stopped

  websocket-server:
    build: ./websocket-server
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - NODE_ENV=production
    networks:
      - messenger-network
    restart: unless-stopped

networks:
  messenger-network:
    driver: bridge